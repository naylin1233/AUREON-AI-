name: AUREON AI CI

concurrency:
  group: aureon-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg/FFprobe are not available on this runner image."
            exit 1
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run build
          npm test
          npm run test:subtitles
